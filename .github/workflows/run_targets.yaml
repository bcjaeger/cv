name: Publish CV to GitHub Pages

# cv.html is rendered locally with targets::tar_make(cv_html) and committed;
# this workflow only publishes it.
on:
  push:
    branches:
      - main
    paths:
      - cv.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp cv.html _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
